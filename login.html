<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plinko - Login / Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
  </head>
  <body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl max-w-md w-full border border-slate-700">
      <div class="flex justify-center mb-6">
        <h1 class="text-3xl font-extrabold text-cyan-400">PLINKO</h1>
      </div>

      <!-- Toggle Tabs -->
      <div class="flex border-b border-slate-700 mb-6">
        <button id="tab-login" class="flex-1 pb-3 text-center border-b-2 border-cyan-400 font-semibold text-white">Login</button>
        <button id="tab-register" class="flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 font-semibold hover:text-white">Register</button>
      </div>

      <!-- Error Message -->
      <div id="error-message" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500 text-red-400 rounded text-sm"></div>

      <!-- Form -->
      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
          <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-cyan-400" placeholder="you@example.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-md py-2 px-3 text-white focus:outline-none focus:border-cyan-400" placeholder="••••••••" />
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 active:bg-cyan-600 text-slate-900 font-bold py-2 px-4 rounded-md transition duration-200">
          Sign In
        </button>
      </form>
    </div>

    <script type="module">
      import { auth, db } from "./src/lib/firebase.ts";
      import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      let isLoginMode = true;

      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const submitBtn = document.getElementById('submit-btn');
      const authForm = document.getElementById('auth-form');
      const errorMessage = document.getElementById('error-message');

      tabLogin.addEventListener('click', () => {
        isLoginMode = true;
        tabLogin.className = "flex-1 pb-3 text-center border-b-2 border-cyan-400 font-semibold text-white";
        tabRegister.className = "flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 font-semibold hover:text-white";
        submitBtn.textContent = "Sign In";
        errorMessage.classList.add('hidden');
      });

      tabRegister.addEventListener('click', () => {
        isLoginMode = false;
        tabRegister.className = "flex-1 pb-3 text-center border-b-2 border-cyan-400 font-semibold text-white";
        tabLogin.className = "flex-1 pb-3 text-center border-b-2 border-transparent text-slate-400 font-semibold hover:text-white";
        submitBtn.textContent = "Create Account";
        errorMessage.classList.add('hidden');
      });

      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        errorMessage.classList.add('hidden');

        try {
          if (isLoginMode) {
            await signInWithEmailAndPassword(auth, email, password);
          } else {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Initialize Firestore user document with initial balance
            await setDoc(doc(db, "users", user.uid), {
              balance: 200,
              createdAt: new Date().toISOString()
            });
          }
          // Redirect to the main Plinko game after successful login/registration
          window.location.href = "./index.html";
        } catch (err) {
          errorMessage.textContent = err.message.replace("Firebase: ", "");
          errorMessage.classList.remove('hidden');
        }
      });
    </script>
  </body>
</html>
